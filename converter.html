<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Converter</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#0b0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
(function(){try{let d=localStorage.getItem('gold_theme')||localStorage.getItem('app_theme');if(d){let t=JSON.parse(d),r=document.documentElement;if(t.primary)r.style.setProperty('--primary',t.primary);if(t.secondary)r.style.setProperty('--secondary',t.secondary);if(t.bg)r.style.setProperty('--bg-color',t.bg);if(t.card)r.style.setProperty('--card-bg',t.card);if(t.text)r.style.setProperty('--text-main',t.text);}}catch(e){}})();
</script>
<style>
:root { --primary:#f0b90b; --primary-dark:#c99400; --secondary:#3ecbe0; --bg-color:#0b0e14; --bg-color-2:#10141c; --card-bg:#151a24; --card-bg-soft:rgba(255,255,255,0.05); --text-main:#f1f3f7; --text-muted:#94a3b8; --border:rgba(255,255,255,0.12); --glass-hi:rgba(255,255,255,0.22); --shadow-card:0 16px 36px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.14); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; padding:0; font-family:'Manrope',sans-serif; background:radial-gradient(circle at 50% 0%, var(--bg-color-2) 0%, var(--bg-color) 70%); display:flex; flex-direction:column; height:100vh; color:var(--text-main); padding-top:env(safe-area-inset-top); -webkit-font-smoothing:antialiased; position:relative; overflow:hidden; }
body::before, body::after { content:""; position:fixed; border-radius:50%; filter:blur(80px); z-index:0; pointer-events:none; }
body::before { width:270px; height:270px; background:var(--secondary); top:-50px; right:-60px; opacity:0.22; }
body::after { width:310px; height:310px; background:var(--primary); bottom:-80px; left:-80px; opacity:0.2; }
.top-bar { height:60px; background:rgba(15,20,28,0.45); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); display:flex; align-items:center; padding:0 18px; color:#fff; justify-content:space-between; box-shadow:0 4px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08); z-index:100; border-bottom:1px solid var(--border); flex-shrink:0; }
.menu-icon { font-size:22px; cursor:pointer; color:#fff; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); transition:0.2s; }
.menu-icon:active { transform:scale(0.9); background:rgba(255,255,255,0.14); }
.app-title { font-size:18px; font-weight:800; letter-spacing:0.6px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.4); }
#menuPopup { display:none; position:absolute; top:calc(66px + env(safe-area-inset-top)); left:14px; width:235px; background:rgba(18,24,34,0.72); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-radius:20px; box-shadow:0 24px 48px rgba(0,0,0,0.65), inset 0 1px 1px var(--glass-hi); z-index:2000; flex-direction:column; border:1px solid rgba(255,255,255,0.16); overflow:hidden; }
.menu-item { padding:15px 18px; text-decoration:none; color:var(--text-main); border-bottom:1px solid rgba(255,255,255,0.07); font-weight:600; font-size:14.5px; display:flex; align-items:center; transition:0.2s; }
.menu-item:hover, .menu-item:active { background:rgba(255,255,255,0.1); padding-left:24px; }
.menu-icon-span { margin-right:12px; font-size:18px; }
.content { flex:1; padding:20px; overflow-y:auto; max-width:520px; margin:0 auto; width:100%; z-index:2; }
.card { background:linear-gradient(145deg, rgba(255,255,255,0.09) 0%, color-mix(in srgb, var(--card-bg) 55%, transparent) 100%); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%); border:1px solid var(--border); border-radius:24px; padding:22px; margin-bottom:22px; box-shadow:var(--shadow-card); transition:0.2s; }
.card-orange { border-top:3px solid var(--primary); background:linear-gradient(160deg, rgba(240,185,11,0.12), color-mix(in srgb, var(--card-bg) 58%, transparent) 60%); }
.card-header-orange { color:var(--primary); font-size:17px; font-weight:800; margin-bottom:16px; letter-spacing:0.3px; }
.card-blue { border-top:3px solid var(--secondary); background:linear-gradient(160deg, rgba(62,203,224,0.12), color-mix(in srgb, var(--card-bg) 58%, transparent) 60%); }
.card-header-blue { color:var(--secondary); font-size:17px; font-weight:800; margin-bottom:16px; letter-spacing:0.3px; }
.input-group { display:flex; gap:10px; margin-bottom:12px; }
.c-input { width:100%; padding:13px; border:1.5px solid var(--border); border-radius:14px; font-size:16px; font-weight:700; text-align:center; outline:none; background:rgba(8,11,18,0.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:#fff; min-height:50px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.35); transition:0.2s; font-family:'Manrope',sans-serif; }
.c-input::placeholder { color:#56617a; font-weight:600; }
.c-input:focus { border-color:var(--secondary); box-shadow:0 0 0 4px rgba(62,203,224,0.15), inset 0 2px 8px rgba(0,0,0,0.35); background:rgba(12,16,26,0.75); }
.card-orange .c-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(240,185,11,0.15), inset 0 2px 8px rgba(0,0,0,0.35); }
.unit-label { font-size:10.5px; text-transform:uppercase; color:var(--text-muted); text-align:center; margin-bottom:5px; font-weight:800; letter-spacing:0.5px; }
.result-box { background:linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:16px; padding:16px; text-align:center; margin-top:16px; border:1px solid var(--border); border-top-color:rgba(255,255,255,0.2); box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.res-val { font-size:30px; font-weight:900; line-height:1; }
.res-unit { font-size:11.5px; color:var(--text-muted); font-weight:800; margin-top:6px; text-transform:uppercase; letter-spacing:0.5px; }
.text-orange { color:var(--primary); text-shadow:0 0 20px rgba(240,185,11,0.35); }
.text-blue { color:var(--secondary); text-shadow:0 0 20px rgba(62,203,224,0.35); }
@media (min-width:600px) { .content { padding-top:28px; } }
</style>
</head>
<body>
<div class="top-bar">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <span class="app-title">Weight Converter</span>
    <div style="width:38px;"></div>
</div>
<div id="menuPopup">
    <a href="index.html" class="menu-item"><span class="menu-icon-span">🏠</span> Dashboard</a>
    <a href="rate.html" class="menu-item"><span class="menu-icon-span">📝</span> Rate F</a>
    <a href="converter.html" class="menu-item" style="background:rgba(255,255,255,0.08); border-left:4px solid var(--secondary);"><span class="menu-icon-span">⚖️</span> Converter</a>
    <a href="price.html" class="menu-item"><span class="menu-icon-span">💰</span> Price Calc</a>
    <a href="casio.html" class="menu-item"><span class="menu-icon-span">🔢</span> Casio Calc</a>
    <a href="settings.html" class="menu-item" style="border-bottom:none;"><span class="menu-icon-span">⚙️</span> Settings</a>
</div>
<div class="content">
    <div class="card card-blue">
        <div class="card-header-blue"><span>🔷 Gram to Traditional</span></div>
        <div>
            <div class="unit-label">Enter Weight in Grams</div>
            <input type="number" id="gramInput" class="c-input" placeholder="0.000" style="font-size:24px;" oninput="calcToVori()">
        </div>
        <div class="result-box" style="display:flex; justify-content:space-around; align-items:center; padding:12px 10px;">
            <div><div class="res-val text-blue" id="resVori" style="font-size:24px;">0</div><div class="res-unit">Vori</div></div>
            <div style="font-size:20px; color:rgba(255,255,255,0.18);">|</div>
            <div><div class="res-val text-blue" id="resAna" style="font-size:24px;">0</div><div class="res-unit">Ana</div></div>
            <div style="font-size:20px; color:rgba(255,255,255,0.18);">|</div>
            <div><div class="res-val text-blue" id="resRoti" style="font-size:24px;">0</div><div class="res-unit">Roti</div></div>
            <div style="font-size:20px; color:rgba(255,255,255,0.18);">|</div>
            <div><div class="res-val text-blue" id="resPoint" style="font-size:24px;">0</div><div class="res-unit">Point</div></div>
        </div>
        <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--text-muted); font-weight:600; opacity:0.8;">1 Vori = 11.664 Grams</div>
    </div>
    <div class="card card-orange">
        <div class="card-header-orange"><span>🔶 Traditional to Gram</span></div>
        <div class="input-group">
            <div style="flex:1;"><div class="unit-label">Vori</div><input type="number" id="vori" class="c-input" placeholder="0" oninput="calcToGram()"></div>
            <div style="flex:1;"><div class="unit-label">Ana</div><input type="number" id="ana" class="c-input" placeholder="0" oninput="calcToGram()"></div>
        </div>
        <div class="input-group">
            <div style="flex:1;"><div class="unit-label">Roti</div><input type="number" id="roti" class="c-input" placeholder="0" oninput="calcToGram()"></div>
            <div style="flex:1;"><div class="unit-label">Point</div><input type="number" id="point" class="c-input" placeholder="0" oninput="calcToGram()"></div>
        </div>
        <div class="result-box">
            <div class="res-val text-orange" id="resGram">0.000</div>
            <div class="res-unit">Total Grams</div>
        </div>
    </div>
</div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js');});}
function toggleMenu(){const m=document.getElementById('menuPopup');m.style.display=(m.style.display==='flex')?'none':'flex';}
window.addEventListener('click',function(e){const m=document.getElementById('menuPopup'),btn=document.querySelector('.menu-icon');if(e.target!==m&&e.target!==btn&&!m.contains(e.target))m.style.display='none';});

function calcToGram(){
    let v=parseFloat(document.getElementById('vori').value)||0;
    let a=parseFloat(document.getElementById('ana').value)||0;
    let r=parseFloat(document.getElementById('roti').value)||0;
    let p=parseFloat(document.getElementById('point').value)||0;
    let total=(v*11.664)+(a*0.729)+(r*0.1215)+(p*0.01215);
    document.getElementById('resGram').innerText=total.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3});
}
function calcToVori(){
    let g=parseFloat(document.getElementById('gramInput').value)||0;
    let totalVori=g/11.664;
    let v=Math.floor(totalVori);
    let rem1=(totalVori-v)*16;
    let a=Math.floor(rem1);
    let rem2=(rem1-a)*6;
    let r=Math.floor(rem2);
    let p=(rem2-r)*10;
    document.getElementById('resVori').innerText=v;
    document.getElementById('resAna').innerText=a;
    document.getElementById('resRoti').innerText=r;
    document.getElementById('resPoint').innerText=p.toFixed(1);
}
</script>
</body>
</html>
